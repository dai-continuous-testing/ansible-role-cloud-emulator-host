---

__installation_root_folder: "/Applications/Experitest"
installation_folder: "{{ installation_root_folder }}/{{ app_name }}-{{ app_version }}"

temp_folder: "/tmp/experitest"

service_plist_file_path: "/Library/LaunchDaemons/{{ service_name }}.plist"

installer_file_name: "dist-Mac-AGENT-{{ app_version }}.zip"

relative_path: "cloud-agent/osx"

launcher_file_name: "start.sh"

mac_ehm_user: "_experitestd"

java_source_installation_folder: "/Applications/Experitest/jre"

java_installation_folder: "/usr/local/share/jre"

java_runtime_directory_name: "jdk{{ java_version }}-jre"

java_source_runtime_folder: "{{ java_source_installation_folder }}/{{ java_runtime_directory_name }}"

java_runtime_folder: "{{ java_installation_folder }}/{{ java_runtime_directory_name }}"

java_source_bin: "{{ java_source_runtime_folder }}/Contents/Home/bin/java"

java_bin: "{{ java_runtime_folder }}/Contents/Home/bin/java"
