---

# validation

- name: assert all vars are set
  assert: 
    that:
      - item is defined
      - item | length > 0
    quiet: true
  loop:
  - service_plist_file_path
  - installation_folder

# migrate required java dependency to shared location

- name: check if required source java is available
  stat:
    path: "{{ java_source_bin }}"
  register: java_source_bin_stat
  become: yes

- name: check if required shared java is already available
  stat:
    path: "{{ java_bin }}"
  register: java_shared_bin_stat
  become: yes

- name: fail if the required java runtime is missing from both source and shared locations
  fail:
    msg: >-
      Required java runtime was not found in either {{ java_source_bin }} or {{ java_bin }}.
      Install the expected JRE with the external JRE role before deploying EHM.
  when:
    - not java_source_bin_stat.stat.exists
    - not java_shared_bin_stat.stat.exists

- name: make sure shared java installation folder exists
  file:
    path: "{{ java_installation_folder }}"
    state: directory
    mode: '0755'
  become: yes

- name: synchronize the required java runtime into the shared location
  command:
    argv:
      - rsync
      - -a
      - --delete
      - --itemize-changes
      - "{{ java_source_runtime_folder }}/"
      - "{{ java_runtime_folder }}/"
  register: java_runtime_sync
  changed_when: java_runtime_sync.stdout | length > 0
  become: yes
  when: java_source_bin_stat.stat.exists

- name: verify shared java binary after synchronization
  stat:
    path: "{{ java_bin }}"
  register: java_shared_bin_verified
  become: yes

- name: fail if shared java binary is still missing after synchronization
  fail:
    msg: "Shared java binary was not found at {{ java_bin }} after migration"
  when: not java_shared_bin_verified.stat.exists

- name: discover stale shared java entries
  shell: |
    find "{{ java_installation_folder }}" -mindepth 1 -maxdepth 1 ! -name "{{ java_runtime_directory_name }}" -print
  register: stale_shared_java_entries
  changed_when: false
  become: yes

- name: remove stale shared java entries
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ stale_shared_java_entries.stdout_lines }}"
  become: yes
  when:
    - java_shared_bin_verified.stat.exists
    - stale_shared_java_entries.stdout_lines | length > 0

- name: discover obsolete source java entries
  shell: |
    find "{{ java_source_installation_folder }}" -mindepth 1 -maxdepth 1 -print
  register: obsolete_source_java_entries
  changed_when: false
  become: yes
  when:
    - java_source_bin_stat.stat.exists
    - java_shared_bin_verified.stat.exists

- name: empty the old source java folder after successful migration
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ obsolete_source_java_entries.stdout_lines }}"
  become: yes
  when:
    - java_source_bin_stat.stat.exists
    - java_shared_bin_verified.stat.exists
    - obsolete_source_java_entries.stdout_lines | length > 0

# required java dependency

- name: make sure java is installed on the machine
  command: "{{ java_bin }} -version"
  register: java_test
  become: yes
  ignore_errors: yes

- name: fail if java is not found
  fail:
    msg: "java must be accesible in path {{ java_bin }}"
  when: java_test.rc != 0

# update service
- name: stop the old service
  command: "launchctl unload {{ service_plist_file_path }}"
  become: yes
  notify:
    - start the service

- name: kill adb processes
  shell: |
    killall adb
  register: killadbresults
  changed_when: killadbresults.rc == 0
  failed_when: killadbresults.rc != 0 and killadbresults.rc != 1
  become: yes

- name: copy plist
  template:
    src: service.plist.j2
    dest: "{{ service_plist_file_path }}"
    # in mac - plist owner is root
    owner: root
  become: yes


# fixed xcode select

- name: Fix xcode select
  shell: xcode-select -s /Applications/Xcode.app/Contents/Developer/
  become: yes


 ## Issue - need to verify this command
- name: run mac xcode tools for ehm
  command: "/bin/sh {{ installation_folder }}/conf/plist/macXcodeTools.sh {{ mac_ehm_user }}"
  become: yes

- name: add permission to /tmp/experitest_simulators folder
  file:
    path: "/tmp/experitest_simulators"
    state: directory
    recurse: yes
    mode: u+rwx,g+rw,o+rw
    owner: "{{ mac_ehm_user }}"
  become: yes

- name: change owner of installation folder to current user for android support
  file:
    path: "{{ installation_folder }}"
    state: directory
    recurse: yes
    owner: "{{ ansible_user_id }}"
  become: yes

